name: 'Native Clang-Tidy Analysis'
description: 'Run clang-tidy analysis without Docker'
inputs:
  build_dir:
    description: 'Build directory for CMake'
    required: false
    default: 'build'
  exclude:
    description: 'Directories to exclude from analysis (space-separated)'
    required: false
    default: '3rdparty build'
  clang_tidy_version:
    description: 'Clang-tidy version to use'
    required: false
    default: '21'
outputs:
  total_comments:
    description: 'Total number of clang-tidy issues found'
    value: ${{ steps.analyze.outputs.total_comments }}
runs:
  using: 'composite'
  steps:
    - name: Verify clang-tidy installation
      shell: bash
      run: |
        clang-tidy-${{ inputs.clang_tidy_version }} --version || \
          (echo "::error::clang-tidy-${{ inputs.clang_tidy_version }} not found" && exit 1)

    - name: Get changed files
      id: changed-files
      shell: bash
      run: |
        set -euo pipefail

        # mark workspace safe for git operations
        git config --global --add safe.directory "${GITHUB_WORKSPACE}"

        # Default exclude list (from inputs)
        EXCLUDE_RAW="${{ inputs.exclude }}"
        # Normalize: remove leading/trailing spaces, convert to array-like tokenization by whitespace
        read -r -a EXCLUDE_ARR <<< "$EXCLUDE_RAW"

        # Prepare an empty variable
        CHANGED_FILES=""

        echo "Event name: ${GITHUB_EVENT_NAME}"

        if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
          # We're running on a PR -> compare with PR base
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "${BASE_REF}" ]; then
            echo "::warning::Pull request base ref is empty; falling back to listing all files"
          else
            echo "Fetching origin/${BASE_REF}..."
            # Fetch that ref only (shallow) to speed up
            git fetch --no-tags --prune origin "${BASE_REF}:${BASE_REF}" || true

            echo "Checking if .clang-tidy changed between origin/${BASE_REF} and HEAD..."
            CLANG_TIDY_CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- '**/.clang-tidy' || true)

            if [ -n "$CLANG_TIDY_CHANGED" ]; then
              echo "::notice::.clang-tidy configuration changed, analyzing all source files"
              # Find all source files
              CHANGED_FILES=$(git ls-files '*.cpp' '*.c' '*.hpp' '*.h' || true)
            else
              # Only analyze changed source files
              CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- '*.cpp' '*.hpp' '*.c' '*.h' || true)
            fi
          fi
        fi

        # If not a PR or fallback because BASE_REF was empty, list all tracked source files
        if [ -z "$CHANGED_FILES" ]; then
          echo "Not a pull_request or no diff detected — listing all tracked source files"
          CHANGED_FILES=$(git ls-files '*.cpp' '*.c' '*.hpp' '*.h' || true)

          # If git ls-files returned nothing (rare), fallback to find
          if [ -z "$CHANGED_FILES" ]; then
            CHANGED_FILES=$(find . -type f \
              \( -name "*.cpp" -o -name "*.c" -o -name "*.hpp" -o -name "*.h" \) \
              -print || true)
            CHANGED_FILES=$(echo "$CHANGED_FILES" | sed 's#^\./##')
          fi
        fi

        # Exclude directories from the list
        for exclude_dir in "${EXCLUDE_ARR[@]}"; do
          # if exclude_dir blank, skip
          if [ -z "$exclude_dir" ]; then
            continue
          fi
          CHANGED_FILES=$(printf '%s\n' "$CHANGED_FILES" | grep -E '^tasks/nalitov_d_matrix_min_by_columns/' || true)
        done

        # Remove empty lines and duplicates, preserve order
        CHANGED_FILES=$(printf '%s\n' "$CHANGED_FILES" | sed '/^\s*$/d' | awk '!seen[$0]++')

        # Write outputs
        echo "changed_files<<EOF" >> $GITHUB_OUTPUT
        printf '%s\n' "$CHANGED_FILES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

        if [ -z "$CHANGED_FILES" ]; then
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          echo "has_changes=true" >> $GITHUB_OUTPUT
        fi

    - name: Run clang-tidy analysis
      id: analyze
      shell: bash
      if: steps.changed-files.outputs.has_changes == 'true'
      run: |
        set -euo pipefail

        COMMENTS_FILE=$(mktemp)
        TOTAL_ISSUES=0

        # Read the changed_files output line-by-line
        # Use a here-doc to preserve newlines from the composite output
        CHANGED_FILES_CONTENT="${{ steps.changed-files.outputs.changed_files }}"
        if [ -z "${CHANGED_FILES_CONTENT}" ]; then
          echo "No files to analyze"
          echo "total_comments=0" >> $GITHUB_OUTPUT
          exit 0
        fi

        while IFS= read -r file; do
          # skip empty lines
          [ -z "$file" ] && continue

          # sanity: skip non-existing files (they could be deleted in PR)
          if [ ! -f "$file" ]; then
            echo "Skip: $file (not a regular file)"
            continue
          fi

          echo "Analyzing $file..."
          FILE_OUTPUT=$(mktemp)
          # run clang-tidy on single file; clang-tidy returns non-zero on some failures, so capture output
          if clang-tidy-${{ inputs.clang_tidy_version }} "$file" \
            -p "${{ inputs.build_dir }}" --format-style=file 2>&1 | tee "$FILE_OUTPUT"; then
            ISSUES=$(grep -cE "warning:|error:" "$FILE_OUTPUT" 2>/dev/null || echo "0")
            ISSUES=$(echo "$ISSUES" | tr -d '[:space:]')
            TOTAL_ISSUES=$((TOTAL_ISSUES + ${ISSUES:-0}))
            # append to comments file
            cat "$FILE_OUTPUT" >> "$COMMENTS_FILE"
          else
            # Even if clang-tidy returns non-zero, try to count issues if any
            ISSUES=$(grep -cE "warning:|error:" "$FILE_OUTPUT" 2>/dev/null || echo "0")
            ISSUES=$(echo "$ISSUES" | tr -d '[:space:]')
            TOTAL_ISSUES=$((TOTAL_ISSUES + ${ISSUES:-0} + 0))
            cat "$FILE_OUTPUT" >> "$COMMENTS_FILE"
            echo "::warning::clang-tidy exit code non-zero for file $file"
          fi
          rm -f "$FILE_OUTPUT"
        done <<< "$CHANGED_FILES_CONTENT"

        echo "total_comments=$TOTAL_ISSUES" >> $GITHUB_OUTPUT

        if [ -f "$COMMENTS_FILE" ] && [ -s "$COMMENTS_FILE" ]; then
          echo "::group::Clang-tidy Analysis Results"
          cat "$COMMENTS_FILE"
          echo "::endgroup::"
        fi

        if [ "$TOTAL_ISSUES" -gt 0 ]; then
          echo "::error::Found $TOTAL_ISSUES clang-tidy issues"
        else
          echo "No clang-tidy issues found"
        fi

    - name: Set output for no changes
      shell: bash
      if: steps.changed-files.outputs.has_changes == 'false'
      run: |
        echo "total_comments=0" >> $GITHUB_OUTPUT
